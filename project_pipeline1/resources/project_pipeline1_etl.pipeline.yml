# The main pipeline for project_pipeline1

resources:
  pipelines:
    project_pipeline1_etl:
      name: project_pipeline1_etl
      ## Catalog is required for serverless compute
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/project_pipeline1_etl"

      libraries:
        - glob:
            include: ../src/project_pipeline1_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
